---
- name: Gather detailed information from RHEL8 server and create HTML spreadsheet report
  hosts: prccnonprodservers
  remote_user: afernandez
  become: yes
  become_method: sudo
  vars:
    dest_base_path: "/tmp/html-report/prcc"
    src_path: "/tmp/server_info"
    current_date: "{{ lookup('pipe', 'date +%Y-%m-%d') }}"

  tasks:
    - name: Ensure output directory exists on remote
      file:
        path: "{{ src_path }}"
        state: directory
        mode: '0755'

    - name: Start HTML report with horizontal layout and wrapped cells
      copy:
        content: |
          <html>
          <head>
            <title>System Report</title>
            <style>
              table {
                width: 100%;
                border-collapse: collapse;
                table-layout: fixed;
              }
              th, td {
                border: 1px solid #000;
                padding: 6px;
                text-align: left;
                vertical-align: top;
                white-space: pre-wrap;
                word-wrap: break-word;
                font-family: monospace;
                font-size: 12px;
              }
              th {
                background-color: #2a5d78;
                color: #ffffff;
              }
            </style>
          </head>
          <body>
          <table>
          <tr>
            <th>Hostname</th>
            <th>IP Address</th>
            <th>Uptime</th>
            <th>Processors</th>
            <th>Memory</th>
            <th>Kernel Version</th>
            <th>Datadog</th>
            <th>Netdata</th>
            <th>Open Ports</th>
            <th>Local Filesystems</th>
            <th>NFS and CIFS mounts</th>
            <th>Firewall status</th>
            <th>Crontab</th>
            <th>Top Memory</th>
            <th>Top CPU</th>
            <th>Last Logins</th>
            <th>Last Patch</th>
          </tr>
          <tr>
        dest: "{{ src_path }}/report.html"

    - name: Gather system information and append to HTML row
      shell: |
        echo -n "<td><pre>$(hostname)</pre></td>" >> {{ src_path }}/report.html
        echo -n "<td><pre>$(hostname -I)</pre></td>" >> {{ src_path }}/report.html
        echo -n "<td><pre>$(uptime)</pre></td>" >> {{ src_path }}/report.html
        echo -n "<td><pre>$(nproc)</pre></td>" >> {{ src_path }}/report.html
        echo -n "<td><pre>$(free -h)</pre></td>" >> {{ src_path }}/report.html
        echo -n "<td><pre>$(uname -r)</pre></td>" >> {{ src_path }}/report.html
        datadog=$(systemctl is-active datadog-agent &>/dev/null && echo "Running" || echo "Not Found")
        echo -n "<td><pre>${datadog}</pre></td>" >> {{ src_path }}/report.html
        netdata=$(systemctl is-active netdata &>/dev/null && echo "Running" || echo "Not Found")
        echo -n "<td><pre>${netdata}</pre></td>" >> {{ src_path }}/report.html
        echo -n "<td><pre>$(nmap -sT -p- --min-rate=1000 -T4 localhost | grep -E 'open')</pre></td>" >> {{ src_path }}/report.html
        echo -n "<td><pre>$(df -h --exclude-type=tmpfs --exclude-type=devtmpfs)</pre></td>" >> {{ src_path }}/report.html
        nfs=$(df -hT | grep -E 'nfs|cifs')
        [[ -z "$nfs" ]] && nfs="No NFS or CIFS mounts"
        echo -n "<td><pre>${nfs}</pre></td>" >> {{ src_path }}/report.html
        fw=$(firewall-cmd --state &>/dev/null && firewall-cmd --list-all || echo "Firewall is not running")
        echo -n "<td><pre>${fw}</pre></td>" >> {{ src_path }}/report.html
        echo -n "<td><pre>$(crontab -l 2>/dev/null || echo 'No crontab')</pre></td>" >> {{ src_path }}/report.html
        echo -n "<td><pre>$(ps aux --sort=-%mem | head -n 8)</pre></td>" >> {{ src_path }}/report.html
        echo -n "<td><pre>$(ps aux --sort=-%cpu | head -n 8)</pre></td>" >> {{ src_path }}/report.html
        echo -n "<td><pre>$(last -n 7)</pre></td>" >> {{ src_path }}/report.html
        echo "<td><pre>$(dnf history | grep update)</pre></td>" >> {{ src_path }}/report.html

    - name: Close HTML table and body
      shell: |
        echo "</tr></table></body></html>" >> {{ src_path }}/report.html

    - name: Create local directory with the current date
      file:
        path: "{{ dest_base_path }}/{{ current_date }}"
        state: directory
        mode: '0755'

    - name: Fetch the report from the remote host
      ansible.builtin.fetch:
        src: "{{ src_path }}/report.html"
        dest: "{{ dest_base_path }}/{{ current_date }}/{{ inventory_hostname }}_report.html"
        flat: yes

