---
- name: Gather detailed information from RHEL8 server and create HTML spreadsheet report
  hosts: prccnonprodservers
  remote_user: afernandez
  become: yes
  become_method: sudo
  vars:
    dest_base_path: "/tmp/html-report/prcc"
    src_path: "/tmp/server_info"
    current_date: "{{ lookup('pipe', 'date +%Y-%m-%d') }}"

  tasks:
    - name: Ensure output directory exists on remote
      file:
        path: "{{ src_path }}"
        state: directory
        mode: '0755'

    - name: Start HTML report with horizontal layout
      copy:
        content: |
          <html>
          <head>
            <title>System Report</title>
            <style>
              table {
                width: 100%;
                border-collapse: collapse;
              }
              th, td {
                border: 1px solid #000;
                padding: 8px;
                text-align: left;
              }
              th {
                background-color: #f2f2f2;
              }
            </style>
          </head>
          <body>
          <table>
          <tr>
            <th>Hostname</th>
            <th>IP Address</th>
            <th>Uptime</th>
            <th>Processors</th>
            <th>Memory</th>
            <th>Kernel Version</th>
            <th>Datadog</th>
            <th>Netdata</th>
            <th>Open Ports</th>
            <th>Filesystems</th>
            <th>NFS/CIFS</th>
            <th>Crontab</th>
            <th>Top Memory</th>
            <th>Top CPU</th>
            <th>Last Logins</th>
            <th>Last Patch</th>
          </tr>
          <tr>
        dest: "{{ src_path }}/report.html"

    - name: Gather system information and append to HTML row
      shell: |
        echo -n "<td>$(hostname)</td>" >> {{ src_path }}/report.html
        echo -n "<td>$(hostname -I)</td>" >> {{ src_path }}/report.html
        echo -n "<td>$(uptime)</td>" >> {{ src_path }}/report.html
        echo -n "<td>$(nproc)</td>" >> {{ src_path }}/report.html
        mem=$(free -h | awk '/Mem:/ {print $2 " total, " $3 " used, " $4 " free"}')
        echo -n "<td>${mem}</td>" >> {{ src_path }}/report.html
        echo -n "<td>$(uname -r)</td>" >> {{ src_path }}/report.html
        datadog=$(systemctl is-active datadog-agent &>/dev/null && echo "Running" || echo "Not Found")
        echo -n "<td>${datadog}</td>" >> {{ src_path }}/report.html
        netdata=$(systemctl is-active netdata &>/dev/null && echo "Running" || echo "Not Found")
        echo -n "<td>${netdata}</td>" >> {{ src_path }}/report.html
        ports=$(nmap -sT -p- --min-rate=1000 -T4 localhost | grep -E "open" | tr '\n' ' ')
        echo -n "<td><pre>${ports}</pre></td>" >> {{ src_path }}/report.html
        fs=$(df -h --exclude-type=tmpfs --exclude-type=devtmpfs --exclude-type=nfs --exclude-type=cifs | tr '\n' ' ')
        echo -n "<td><pre>${fs}</pre></td>" >> {{ src_path }}/report.html
        nfscifs=$(df -hT | grep -E 'nfs|cifs' | tr '\n' ' ')
        [[ -z "$nfscifs" ]] && nfscifs="No NFS/CIFS" 
        echo -n "<td><pre>${nfscifs}</pre></td>" >> {{ src_path }}/report.html
        crontab=$(crontab -l 2>/dev/null || echo "No crontab")
        echo -n "<td><pre>${crontab}</pre></td>" >> {{ src_path }}/report.html
        topmem=$(ps aux --sort=-%mem | head -n 8 | tr '\n' ' ')
        echo -n "<td><pre>${topmem}</pre></td>" >> {{ src_path }}/report.html
        topcpu=$(ps aux --sort=-%cpu | head -n 8 | tr '\n' ' ')
        echo -n "<td><pre>${topcpu}</pre></td>" >> {{ src_path }}/report.html
        logins=$(last -n 7 | tr '\n' ' ')
        echo -n "<td><pre>${logins}</pre></td>" >> {{ src_path }}/report.html
        patch=$(dnf history | grep update | tr '\n' ' ')
        echo "<td><pre>${patch}</pre></td>" >> {{ src_path }}/report.html

    - name: Close HTML table and body
      shell: |
        echo "</tr></table></body></html>" >> {{ src_path }}/report.html

    - name: Create local directory with the current date
      file:
        path: "{{ dest_base_path }}/{{ current_date }}"
        state: directory
        mode: '0755'

    - name: Fetch the report from the remote host
      ansible.builtin.fetch:
        src: "{{ src_path }}/report.html"
        dest: "{{ dest_base_path }}/{{ current_date }}/{{ inventory_hostname }}_report.html"
        flat: yes
